        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #root {
            width: 100%;
            max-width: 400px;
            background-color: white;
            min-height: 100vh;
            position: relative;
        }

        /* Blinkit Brand Colors */
        :root {
            --blinkit-yellow: #FFD100;
            --blinkit-black: #000000;
            --blinkit-gray: #F5F5F5;
            --blinkit-text: #333333;
            --blinkit-border: #E0E0E0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: white;
            border-bottom: 1px solid var(--blinkit-border);
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--blinkit-black);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: var(--blinkit-yellow);
            color: var(--blinkit-black);
            font-size: 12px;
            font-weight: 600;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Search Bar */
        .search-bar {
            padding: 12px 16px;
            background-color: white;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--blinkit-gray);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--blinkit-yellow);
        }

        /* Category Chips */
        .category-chips {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background-color: white;
            scrollbar-width: none;
        }

        .category-chips::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 8px 16px;
            background-color: var(--blinkit-gray);
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .category-chip:hover {
            background-color: #e0e0e0;
        }

        .category-chip.active {
            background-color: var(--blinkit-yellow);
        }

        /* Promo Banner */
        .promo-banner {
            margin: 12px 16px;
            padding: 16px;
            background-color: var(--blinkit-yellow);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .promo-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .promo-content p {
            font-size: 14px;
            color: var(--blinkit-text);
        }

        /* Product Row */
        .product-row {
            padding: 12px 16px;
            overflow-x: auto;
            background-color: white;
            scrollbar-width: none;
        }

        .product-row::-webkit-scrollbar {
            display: none;
        }

        .product-row-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .product-row-items {
            display: flex;
            gap: 12px;
        }

        /* Product Card */
        .product-card {
            min-width: 120px;
            padding: 12px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-emoji {
            font-size: 48px;
            text-align: center;
        }

        .product-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--blinkit-text);
            line-height: 1.2;
        }

        .product-pack {
            font-size: 12px;
            color: #666;
        }

        .product-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--blinkit-black);
        }

        .add-button {
            padding: 8px 16px;
            background-color: var(--blinkit-yellow);
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-button:hover {
            background-color: #e6bc00;
        }

        /* Quantity Stepper */
        .quantity-stepper {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--blinkit-yellow);
            border-radius: 4px;
            padding: 4px 8px;
        }

        .stepper-button {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-display {
            font-size: 14px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        /* Personalised Recommendation Card */
        .personalised-card {
            margin: 12px 16px;
            padding: 16px;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFFFFF 100%);
            border: 2px solid var(--blinkit-yellow);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .personalised-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trust-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .trust-badge.bestseller {
            background-color: var(--blinkit-yellow);
            color: var(--blinkit-black);
        }

        .trust-badge.highly-rated {
            background-color: #4CAF50;
            color: white;
        }

        .trust-badge.trending {
            background-color: #2196F3;
            color: white;
        }

        .personalised-reasoning {
            font-size: 14px;
            color: var(--blinkit-text);
            line-height: 1.4;
            font-style: italic;
        }

        .personalised-actions {
            display: flex;
            gap: 8px;
        }

        .personalised-add {
            flex: 1;
            padding: 12px;
            background-color: var(--blinkit-yellow);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .personalised-skip {
            padding: 12px 24px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px 16px;
        }

        /* Cart Screen */
        .cart-screen {
            padding: 16px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 16px;
            font-weight: 600;
        }

        .bill-breakdown {
            padding: 16px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            margin: 16px 0;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .bill-row.total {
            border-top: 1px solid var(--blinkit-border);
            padding-top: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .checkout-button {
            width: 100%;
            padding: 16px;
            background-color: var(--blinkit-yellow);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        /* Checkout Screen */
        .checkout-screen {
            padding: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .address-block {
            padding: 16px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background-color: white;
            border: 1px solid var(--blinkit-border);
            border-radius: 8px;
            cursor: pointer;
        }

        .payment-method.selected {
            border-color: var(--blinkit-yellow);
            background-color: #FFF9E6;
        }

        .payment-radio {
            width: 20px;
            height: 20px;
        }

        /* Order Confirmation */
        .order-confirmation {
            padding: 32px 16px;
            text-align: center;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .confirmation-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .confirmation-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        .category-trial-note {
            padding: 16px;
            background-color: #E8F5E9;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            margin: 16px 0;
            text-align: left;
        }

        .category-trial-note h4 {
            font-size: 14px;
            font-weight: 600;
            color: #4CAF50;
            margin-bottom: 8px;
        }

        .continue-button {
            width: 100%;
            padding: 16px;
            background-color: var(--blinkit-yellow);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
        }

        /* Empty States */
        .empty-state {
            padding: 32px 16px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #666;
        }

        /* Screen Container */
        .screen {
            padding-bottom: 80px;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        // ==================== MAIN APP ====================
        const App = () => {
            const [currentScreen, setCurrentScreen] = useState("HOME");
            const [cart, setCart] = useState([]);
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedPaymentMethod, setSelectedPaymentMethod] = useState(null);
            const [categoryTrialLogged, setCategoryTrialLogged] = useState(false);
            const [trialCategory, setTrialCategory] = useState(null);
            const [recommendations, setRecommendations] = useState(personalisedRecommendations);
            const [orderHistory, setOrderHistory] = useState({
                purchasedCategories: ["Grocery", "Snacks", "Dairy"],
                orderCount: 3
            });

            const cartCount = getCartCount(cart);
            const currentRecommendation = recommendations.find(r => !r.dismissed);

            const addToCart = (productId) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.productId === productId);
                    if (existingItem) {
                        return prevCart.map(item =>
                            item.productId === productId
                                ? { ...item, quantity: item.quantity + 1 }
                                : item
                        );
                    }
                    return [...prevCart, { productId, quantity: 1 }];
                });
            };

            const incrementQuantity = (productId) => {
                setCart(prevCart =>
                    prevCart.map(item =>
                        item.productId === productId
                            ? { ...item, quantity: item.quantity + 1 }
                            : item
                    )
                );
            };

            const decrementQuantity = (productId) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.productId === productId);
                    if (existingItem && existingItem.quantity === 1) {
                        return prevCart.filter(item => item.productId !== productId);
                    }
                    return prevCart.map(item =>
                        item.productId === productId
                            ? { ...item, quantity: item.quantity - 1 }
                            : item
                    );
                });
            };

            const skipRecommendation = () => {
                if (currentRecommendation) {
                    setRecommendations(prev =>
                        prev.map(rec =>
                            rec.id === currentRecommendation.id
                                ? { ...rec, dismissed: true }
                                : rec
                        )
                    );
                }
            };

            const addRecommendation = (productId) => {
                addToCart(productId);
                
                // Log category trial
                const product = getProduct(productId);
                if (product && isCategoryTrial(currentRecommendation, orderHistory)) {
                    setCategoryTrialLogged(true);
                    setTrialCategory(product.category);
                }
            };

            const handleBack = () => {
                if (currentScreen === "SEARCH" || currentScreen === "CATEGORY" || currentScreen === "CART" || currentScreen === "CHECKOUT") {
                    setCurrentScreen("HOME");
                    setSelectedCategory(null);
                    setSearchQuery("");
                }
            };

            const handlePlaceOrder = () => {
                if (cart.length === 0 || !selectedPaymentMethod) return;
                
                // Update order history
                const newCategories = [...orderHistory.purchasedCategories];
                cart.forEach(item => {
                    const product = getProduct(item.productId);
                    if (product && !newCategories.includes(product.category)) {
                        newCategories.push(product.category);
                    }
                });
                
                setOrderHistory({
                    purchasedCategories: newCategories,
                    orderCount: orderHistory.orderCount + 1
                });
                
                setCurrentScreen("ORDER_CONFIRMATION");
            };

            const handleContinue = () => {
                setCart([]);
                setCategoryTrialLogged(false);
                setTrialCategory(null);
                setSelectedPaymentMethod(null);
                setCurrentScreen("HOME");
                // Reset recommendations
                setRecommendations(personalisedRecommendations.map(r => ({ ...r, dismissed: false })));
            };

            const renderScreen = () => {
                switch (currentScreen) {
                    case "HOME":
                        return (
                            <HomeScreen
                                cart={cart}
                                onAddToCart={addToCart}
                                onIncrement={incrementQuantity}
                                onDecrement={decrementQuantity}
                                onSkipRecommendation={skipRecommendation}
                                onAddRecommendation={addRecommendation}
                                onCategoryClick={setSelectedCategory}
                            />
                        );
                    case "SEARCH":
                        return (
                            <SearchScreen
                                searchQuery={searchQuery}
                                onSearchChange={setSearchQuery}
                                cart={cart}
                                onAddToCart={addToCart}
                                onIncrement={incrementQuantity}
                                onDecrement={decrementQuantity}
                                onBack={handleBack}
                            />
                        );
                    case "CATEGORY":
                        return (
                            <CategoryScreen
                                selectedCategory={selectedCategory}
                                cart={cart}
                                onAddToCart={addToCart}
                                onIncrement={incrementQuantity}
                                onDecrement={decrementQuantity}
                            />
                        );
                    case "CART":
                        return (
                            <CartScreen
                                cart={cart}
                                onIncrement={incrementQuantity}
                                onDecrement={decrementQuantity}
                                onCheckout={() => setCurrentScreen("CHECKOUT")}
                                onAddRecommendation={addRecommendation}
                                onSkipRecommendation={skipRecommendation}
                            />
                        );
                    case "CHECKOUT":
                        return (
                            <CheckoutScreen
                                cart={cart}
                                selectedPaymentMethod={selectedPaymentMethod}
                                onPaymentMethodChange={setSelectedPaymentMethod}
                                onPlaceOrder={handlePlaceOrder}
                                onBack={handleBack}
                            />
                        );
                    case "ORDER_CONFIRMATION":
                        return (
                            <OrderConfirmationScreen
                                categoryTrialLogged={categoryTrialLogged}
                                trialCategory={trialCategory}
                                onContinue={handleContinue}
                            />
                        );
                    default:
                        return null;
                }
            };

            // Handle category selection
            useEffect(() => {
                if (selectedCategory) {
                    setCurrentScreen("CATEGORY");
                }
            }, [selectedCategory]);

            return (
                <div>
                    <Header
                        currentScreen={currentScreen}
                        cartCount={cartCount}
                        onBack={handleBack}
                        onCartClick={() => setCurrentScreen("CART")}
                        onSearchClick={() => setCurrentScreen("SEARCH")}
                    />
                    {renderScreen()}
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
